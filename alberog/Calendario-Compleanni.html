</style><header><a class="back" href="./">← Torna all’albero</a><div class="calendar-masthead"><h1><span>Calendario dei</span><strong>Compleanni</strong></h1><p class="masthead-tagline">I giorni da ricordare, mese per mese.</p></div><div class="calendar-tools"><input type="search" id="birthday-search" placeholder="Cerca una persona…" aria-label="Cerca nel calendario"><a class="back download-birthdays" href="webcal://correale.me/alberog/Compleanni-Famiglia.ics" title="Si apre Calendario: conferma con Iscriviti. Il calendario si aggiorna da solo.">＋ Iscriviti in Calendario Apple</a><a class="back download-birthdays" href="https://calendar.google.com/calendar/r?cid=webcal%3A%2F%2Fcorreale.me%2Falberog%2FCompleanni-Famiglia.ics" target="_blank" rel="noopener" title="Si apre Google Calendar: conferma con Aggiungi. Il calendario si aggiorna da solo.">＋ Aggiungi a Google Calendar</a><a class="back download-birthdays" href="Compleanni-Famiglia.ics" download="Compleanni-Famiglia.ics" title="File .ics da importare una volta in qualsiasi calendario">↓ Scarica il file</a><a class="back download-birthdays" href="Calendario-Onomastici.html">🎉 Vai agli onomastici</a></div><nav class="months" aria-label="Mesi"><a href="#mese-1" aria-label="Gennaio" title="Gennaio">Gen</a><a href="#mese-2" aria-label="Febbraio" title="Febbraio">Feb</a><a href="#mese-3" aria-label="Marzo" title="Marzo">Mar</a><a href="#mese-4" aria-label="Aprile" title="Aprile">Apr</a><a href="#mese-5" aria-label="Maggio" title="Maggio">Mag</a><a href="#mese-6" aria-label="Giugno" title="Giugno">Giu</a><a href="#mese-7" aria-label="Luglio" title="Luglio">Lug</a><a href="#mese-8" aria-label="Agosto" title="Agosto">Ago</a><a href="#mese-9" aria-label="Settembre" title="Settembre">Set</a><a href="#mese-10" aria-label="Ottobre" title="Ottobre">Ott</a><a href="#mese-11" aria-label="Novembre" title="Novembre">Nov</a><a href="#mese-12" aria-label="Dicembre" title="Dicembre">Dic</a><a href="#date-mancanti">Date da completare</a></nav></header><main></main><script>/* famiglia.js sempre aggiornato: niente copie vecchie dalla cache del browser */document.write('<script src="famiglia.js?v='+Date.now()+'"><\/script>')</script><script>
/* Il calendario si costruisce da famiglia.js: per cambiare una data modifica solo quel file. */
(()=>{const D=window.FAMIGLIA,people=[...D.people,...(D.profileOnly||[])];
const MESI=['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key=p=>p.name.toLocaleLowerCase('it');
const nascita=p=>{if(p.birthDate){const[,m,d]=p.birthDate.split('-').map(Number);return{m,d}}return p.birthMonth?{m:p.birthMonth,d:p.birthDay||null}:null};
const persona=p=>`<div class="birthday-person" data-id="${esc(p.id)}" data-name="${esc(key(p))}" role="button" tabindex="0" title="Apri la scheda di ${esc(p.name)}">${p.foto?`<img src="${esc(p.foto.replace('foto/','foto/mini/'))}" onerror="this.onerror=null;this.src='${esc(p.foto)}'" alt="" loading="lazy">`:''}<div><strong>${esc(p.name)}</strong></div></div>`;
const mesi=MESI.map(()=>[]),mancanti=[];
for(const p of people){const n=nascita(p);n?mesi[n.m-1].push({p,d:n.d}):mancanti.push(p)}
let html=mesi.map((lista,i)=>{
 const giorni=[];for(const x of lista){const g=x.d==null?null:giorni.find(g=>g.d===x.d);g?g.ps.push(x.p):giorni.push({d:x.d,ps:[x.p]})}
 giorni.sort((a,b)=>(a.d??99)-(b.d??99));
 const schede=giorni.map(g=>`<article class="birthday birthday-day" data-name="${esc(g.ps.map(key).join(' '))}"><b class="day-number">${g.d??'—'}</b><div class="day-people">${g.ps.map(persona).join('')}</div></article>`).join('');
 return `<section id="mese-${i+1}" class="month"><h2>${MESI[i]} <small>${lista.length}</small></h2><div class="cards">${schede||'<p class="empty">Nessun compleanno registrato.</p>'}</div></section>`}).join('');
mancanti.sort((a,b)=>a.name.localeCompare(b.name,'it'));
html+=`<section class="month" id="date-mancanti"><h2>Date da completare</h2><p>Mese e giorno di nascita non ancora registrati.</p><div class="cards">${mancanti.map(p=>`<article class="birthday" data-name="${esc(key(p))}"><b class="day-number">—</b>${persona(p)}</article>`).join('')}</div></section>`;
document.querySelector('main').innerHTML=html;
/* Clic su un nome: apre la scheda dell'albero sopra il calendario */
let scheda=null;const chiudi=()=>{if(scheda){scheda.remove();scheda=null;document.documentElement.style.overflow=''}};
const apri=id=>{chiudi();scheda=document.createElement('iframe');scheda.className='scheda-frame';scheda.title='Scheda della persona';scheda.src='index.html?embed=1&scheda='+encodeURIComponent(id);document.body.append(scheda);document.documentElement.style.overflow='hidden';scheda.addEventListener('load',()=>scheda&&scheda.focus())};
window.addEventListener('message',e=>{if(e.data&&e.data.tipo==='scheda-chiusa')chiudi()});
document.querySelector('main').addEventListener('click',e=>{const el=e.target.closest('.birthday-person[data-id]');if(el)apri(el.dataset.id)});
document.querySelector('main').addEventListener('keydown',e=>{const el=e.target.closest('.birthday-person[data-id]');if(el&&(e.key==='Enter'||e.key===' ')){e.preventDefault();apri(el.dataset.id)}});
})();
</script><script>document.querySelector("#birthday-search").oninput=e=>{const q=e.target.value.trim().toLocaleLowerCase("it");document.querySelectorAll(".birthday-person").forEach(person=>person.hidden=!person.dataset.name.includes(q));document.querySelectorAll(".birthday").forEach(card=>{const people=[...card.querySelectorAll(".birthday-person")];card.hidden=people.length?people.every(person=>person.hidden):!card.dataset.name.includes(q)})};</script></html>
