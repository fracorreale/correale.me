function hav(a,b){
  var R=6371000,t=Math.PI/180;
  var dLat=(b.lat-a.lat)*t,dLng=(b.lng-a.lng)*t;
  var s=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(a.lat*t)*Math.cos(b.lat*t)*Math.sin(dLng/2)*Math.sin(dLng/2);
  return 2*R*Math.asin(Math.sqrt(s));
}

}

function walkMin(d){return d<10?0:Math.max(1,Math.round(d/80))} // linea d'aria x1,25 a 80 m/min
function parseCoords(s){
  var m=s.trim().match(/^(-?\d{1,2}\.\d+)\s*[,;\s]\s*(-?\d{1,3}\.\d+)$/);
  if(!m)return null;
  var lat=+m[1],lng=+m[2];
  return (lat>=-90&&lat<=90&&lng>=-180&&lng<=180)?{lat:lat,lng:lng}:null;
}
